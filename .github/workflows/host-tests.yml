name: Host tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install host test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu qemu-user e2fsprogs openjdk-17-jdk-headless
      - name: Compile Python sources
        run: python3 -m compileall -q tools tests
      - name: Check publication files
        run: python3 tools/check_repository.py
      - name: Run host tests
        run: python3 -m unittest discover -s tests -v

